<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boarding Pass - Watch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Watch Frame */
        .watch-frame {
            width: 390px;
            height: 390px;
            background: #000000;
            border-radius: 50%;
            border: 12px solid #1a1a1a;
            box-shadow: 
                0 0 0 8px #000000,
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Watch Screen */
        .watch-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            position: relative;
        }

        /* Time Display (top) */
        .time-display {
            position: absolute;
            top: 20px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .boarding-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            animation: fadeIn 0.8s ease-out;
            width: 100%;
        }

        /* Gate Section */
        .gate-section {
            text-align: center;
        }

        .gate-label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .gate-number {
            font-size: 72px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Boarding Time Section */
        .time-section {
            text-align: center;
        }

        .time-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .boarding-time {
            font-size: 32px;
            font-weight: 700;
            color: #60a5fa;
            line-height: 1;
        }

        /* QR Code Section */
        .qr-section {
            background: #ffffff;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .qr-code {
            width: 100px;
            height: 100px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code svg {
            width: 100%;
            height: 100%;
        }

        /* Gate Change Notification */
        .notification {
            position: absolute;
            top: -100%;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
        }

        .notification.show {
            top: 0;
        }

        .notification-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .notification-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .notification-message {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .notification-icon {
            width: 16px;
            height: 16px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        /* Pulse Animation */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tap Indicator */
        .tap-indicator {
            position: absolute;
            bottom: 15px;
            font-size: 10px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: fadeInOut 3s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.5; }
        }

        /* Battery Indicator */
        .battery-indicator {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Flight Info (subtle) */
        .flight-info {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            color: #475569;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Haptic Feedback Effect */
        .haptic-effect {
            animation: haptic 0.3s ease-out;
        }

        @keyframes haptic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.95); }
        }

        /* Watchface glow */
        .watch-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="watch-frame">
        <div class="watch-screen">
            <!-- Current Time -->
            <div class="time-display" id="currentTime">2:45</div>
            
            <!-- Battery -->
            <div class="battery-indicator">🔋 92%</div>

            <!-- Gate Change Notification -->
            <div class="notification" id="notification">
                <div class="notification-content">
                    <div class="notification-title">
                        <svg class="notification-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        Gate Changed
                    </div>
                    <div class="notification-message">New Gate: B12</div>
                </div>
            </div>

            <!-- Main Boarding Info -->
            <div class="boarding-info">
                <!-- Gate -->
                <div class="gate-section">
                    <div class="gate-label">Gate</div>
                    <div class="gate-number pulse" id="gateNumber">A7</div>
                </div>

                <!-- Boarding Time -->
                <div class="time-section">
                    <div class="time-label">Boarding</div>
                    <div class="boarding-time" id="boardingTime">8:00 AM</div>
                </div>

                <!-- QR Code -->
                <div class="qr-section">
                    <div class="qr-code">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Simple QR Code Pattern -->
                            <!-- Top-left position marker -->
                            <rect x="5" y="5" width="25" height="25" fill="none" stroke="#000" stroke-width="3"/>
                            <rect x="10" y="10" width="15" height="15" fill="#000"/>
                            
                            <!-- Top-right position marker -->
                            <rect x="70" y="5" width="25" height="25" fill="none" stroke="#000" stroke-width="3"/>
                            <rect x="75" y="10" width="15" height="15" fill="#000"/>
                            
                            <!-- Bottom-left position marker -->
                            <rect x="5" y="70" width="25" height="25" fill="none" stroke="#000" stroke-width="3"/>
                            <rect x="10" y="75" width="15" height="15" fill="#000"/>
                            
                            <!-- Data pattern (simplified) -->
                            <rect x="35" y="5" width="5" height="5" fill="#000"/>
                            <rect x="45" y="5" width="5" height="5" fill="#000"/>
                            <rect x="55" y="5" width="5" height="5" fill="#000"/>
                            <rect x="65" y="5" width="5" height="5" fill="#000"/>
                            
                            <rect x="5" y="35" width="5" height="5" fill="#000"/>
                            <rect x="5" y="45" width="5" height="5" fill="#000"/>
                            <rect x="5" y="55" width="5" height="5" fill="#000"/>
                            <rect x="5" y="65" width="5" height="5" fill="#000"/>
                            
                            <rect x="35" y="35" width="5" height="5" fill="#000"/>
                            <rect x="45" y="35" width="5" height="5" fill="#000"/>
                            <rect x="55" y="45" width="5" height="5" fill="#000"/>
                            <rect x="65" y="45" width="5" height="5" fill="#000"/>
                            
                            <rect x="35" y="55" width="5" height="5" fill="#000"/>
                            <rect x="45" y="65" width="5" height="5" fill="#000"/>
                            <rect x="55" y="55" width="5" height="5" fill="#000"/>
                            <rect x="65" y="65" width="5" height="5" fill="#000"/>
                            
                            <rect x="35" y="75" width="5" height="5" fill="#000"/>
                            <rect x="45" y="75" width="5" height="5" fill="#000"/>
                            <rect x="55" y="75" width="5" height="5" fill="#000"/>
                            <rect x="65" y="75" width="5" height="5" fill="#000"/>
                            <rect x="75" y="75" width="5" height="5" fill="#000"/>
                            <rect x="85" y="75" width="5" height="5" fill="#000"/>
                            <rect x="90" y="85" width="5" height="5" fill="#000"/>
                            
                            <rect x="35" y="85" width="5" height="5" fill="#000"/>
                            <rect x="45" y="90" width="5" height="5" fill="#000"/>
                            <rect x="55" y="85" width="5" height="5" fill="#000"/>
                            <rect x="65" y="90" width="5" height="5" fill="#000"/>
                            
                            <rect x="75" y="35" width="5" height="5" fill="#000"/>
                            <rect x="85" y="35" width="5" height="5" fill="#000"/>
                            <rect x="90" y="35" width="5" height="5" fill="#000"/>
                            <rect x="75" y="45" width="5" height="5" fill="#000"/>
                            <rect x="85" y="55" width="5" height="5" fill="#000"/>
                            <rect x="90" y="65" width="5" height="5" fill="#000"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Flight Info -->
            <div class="flight-info">AA 1234 • JFK→LAX</div>

            <!-- Tap Indicator -->
            <div class="tap-indicator">Tap for details</div>
        </div>
    </div>

    <script>
        let currentGate = 'A7';
        let hasShownNotification = false;

        // Update current time
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
            document.getElementById('currentTime').textContent = timeString;
        }

        // Simulate gate change after 5 seconds
        function simulateGateChange() {
            setTimeout(() => {
                if (!hasShownNotification) {
                    showGateChangeNotification('B12');
                    hasShownNotification = true;
                }
            }, 5000);
        }

        // Show gate change notification
        function showGateChangeNotification(newGate) {
            const notification = document.getElementById('notification');
            const gateNumberElement = document.getElementById('gateNumber');
            
            // Show notification
            notification.classList.add('show');
            
            // Haptic feedback effect
            document.querySelector('.watch-screen').classList.add('haptic-effect');
            setTimeout(() => {
                document.querySelector('.watch-screen').classList.remove('haptic-effect');
            }, 300);

            // Vibration effect (if supported)
            if ('vibrate' in navigator) {
                navigator.vibrate([100, 50, 100]);
            }

            // Update gate after 3 seconds
            setTimeout(() => {
                gateNumberElement.textContent = newGate;
                currentGate = newGate;
                
                // Hide notification after 2 more seconds
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            }, 3000);
        }

        // Screen tap interaction
        let tapCount = 0;
        document.querySelector('.watch-screen').addEventListener('click', function() {
            tapCount++;
            
            // Haptic feedback
            this.classList.add('haptic-effect');
            setTimeout(() => {
                this.classList.remove('haptic-effect');
            }, 300);

            // Show gate change on double tap (if not shown yet)
            if (tapCount === 2 && !hasShownNotification) {
                showGateChangeNotification('B12');
                hasShownNotification = true;
                tapCount = 0;
            }

            // Reset tap count after 500ms
            setTimeout(() => {
                tapCount = 0;
            }, 500);
        });

        // Update boarding time countdown
        function updateBoardingCountdown() {
            const now = new Date();
            const boardingTime = new Date(now);
            boardingTime.setHours(8, 0, 0, 0); // Set to 8:00 AM
            
            // If current time is past 8 AM, set to tomorrow
            if (now > boardingTime) {
                boardingTime.setDate(boardingTime.getDate() + 1);
            }

            const diff = boardingTime - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            // Update display
            if (hours < 1) {
                document.querySelector('.time-label').textContent = `Boards in ${minutes}m`;
            }
        }

        // Ambient light effect (subtle brightness change)
        let brightness = 1;
        let brightnessDirection = -1;
        function ambientEffect() {
            brightness += brightnessDirection * 0.01;
            if (brightness <= 0.95 || brightness >= 1) {
                brightnessDirection *= -1;
            }
            document.querySelector('.watch-screen').style.filter = `brightness(${brightness})`;
        }

        // Battery drain simulation
        let batteryLevel = 92;
        function updateBattery() {
            batteryLevel = Math.max(85, batteryLevel - 1);
            document.querySelector('.battery-indicator').textContent = `🔋 ${batteryLevel}%`;
        }

        // Wake screen on movement (simulated)
        let isAsleep = false;
        let sleepTimeout;
        
        function wakeScreen() {
            if (isAsleep) {
                document.querySelector('.watch-screen').style.opacity = '1';
                isAsleep = false;
            }
            
            // Reset sleep timer
            clearTimeout(sleepTimeout);
            sleepTimeout = setTimeout(() => {
                document.querySelector('.watch-screen').style.opacity = '0.3';
                isAsleep = true;
            }, 30000); // Sleep after 30 seconds of inactivity
        }

        // Wake on any interaction
        document.addEventListener('click', wakeScreen);
        document.addEventListener('touchstart', wakeScreen);
        document.addEventListener('mousemove', wakeScreen);

        // Initialize
        updateTime();
        setInterval(updateTime, 1000); // Update time every second
        setInterval(updateBoardingCountdown, 60000); // Update countdown every minute
        setInterval(ambientEffect, 100); // Ambient effect
        setInterval(updateBattery, 120000); // Battery drain every 2 minutes

        // Start gate change simulation
        simulateGateChange();

        // Initial wake
        wakeScreen();

        // Prevent context menu on long press
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
